[project]
name = "kestrel-outfitters"
version = "0.3.0"
description = "Kestrel Outfitters: the fictional company and synthetic data behind the Agentic AI book series capstones (iambishal.com)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kestrel = "kestrel.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model or API; run only with scripts/live_check.py"]
addopts = "-m 'not live'"
