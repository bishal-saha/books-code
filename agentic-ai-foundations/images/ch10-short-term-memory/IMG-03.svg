<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Threshold-triggered compaction before a model call</title>
  <desc id="d">Before each model call, manage_context counts the history's tokens. Below the threshold, the model call goes ahead. Above it, compact splits the units into older ones and the newest ones kept verbatim, at a cut point, and sends the older units to one summary model call. If the summary is good, the new state holds the pinned task, the summary and the kept units. If the call fails, is cut off or saves nothing, compact falls back to trimming below the threshold. Either way the summary call's usage is charged to the run budget and the event is recorded in the step's record, and then the model call runs. A trim to the trim target runs last as a safety net.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="88" font-size="40" font-weight="600">Compaction: a number in code decides, not the model</text>

    <rect x="80" y="150" width="330" height="90" rx="45" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="245" y="205" font-size="26" font-weight="600" text-anchor="middle">Before a model call</text>

    <rect x="80" y="300" width="330" height="90" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="245" y="355" font-size="26" font-weight="600" text-anchor="middle">count_tokens</text>

    <rect x="80" y="450" width="330" height="100" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="245" y="510" font-size="26" font-weight="600" text-anchor="middle">Above threshold?</text>

    <rect x="530" y="450" width="400" height="100" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="730" y="495" font-size="26" font-weight="600" text-anchor="middle">Split at a cut point:</text>
    <text x="730" y="530" font-size="22" text-anchor="middle">older units | newest kept verbatim</text>

    <rect x="1050" y="450" width="470" height="100" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1285" y="495" font-size="26" font-weight="600" text-anchor="middle">One summary model call</text>
    <text x="1285" y="530" font-size="22" text-anchor="middle">compaction_v1 prompt, older units as data</text>

    <rect x="1050" y="620" width="470" height="100" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1285" y="665" font-size="26" font-weight="600" text-anchor="middle">✓ New state</text>
    <text x="1285" y="700" font-size="22" text-anchor="middle">task + summary + kept units</text>

    <rect x="530" y="620" width="400" height="100" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="3"/>
    <text x="730" y="665" font-size="26" font-weight="600" text-anchor="middle">✕ Failed, cut off, no saving</text>
    <text x="730" y="700" font-size="22" text-anchor="middle">fall back: trim below threshold</text>

    <rect x="530" y="780" width="990" height="80" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="1025" y="830" font-size="24" text-anchor="middle">Charge the summary call to the run budget; record it in this step's record</text>

    <rect x="80" y="780" width="330" height="80" rx="40" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="245" y="830" font-size="26" font-weight="600" text-anchor="middle">Model call</text>

    <!-- arrows -->
    <path d="M245 240 L 245 296" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M245 390 L 245 446" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M245 550 L 245 776" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="262" y="670" font-size="22">no</text>
    <path d="M410 500 L 526 500" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="440" y="485" font-size="22">yes</text>
    <path d="M930 500 L 1046 500" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1285 550 L 1285 616" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1300" y="592" font-size="22">ok</text>
    <path d="M1100 550 C 1000 590, 960 610, 934 640" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1285 720 L 1285 776" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M730 720 L 730 776" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M530 820 L 414 820" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
