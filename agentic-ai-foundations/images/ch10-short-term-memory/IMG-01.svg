<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">ConversationState: what it holds and what it sends</title>
  <desc id="d">ConversationState holds four fields: task, pinned and never trimmed or compacted; summary, empty until the first compaction; messages, the history of questions, tool rounds and replies; and compactions, a counter for the step log. to_messages() joins the task, the summary in escaped data tags and the first retained question into one opening user message, followed by the rest of the history. That rendered history goes to the model client twice: to count_tokens, to measure it, and to the model call.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="88" font-size="40" font-weight="600">ConversationState: four fields, one rendered history</text>

    <!-- the state panel -->
    <rect x="80" y="150" width="620" height="660" rx="14" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="110" y="198" font-size="28" font-weight="600" fill="#A5B4FC">ConversationState</text>

    <rect x="120" y="230" width="540" height="120" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="150" y="280" font-size="28" font-weight="600">task  (pinned)</text>
    <text x="150" y="322" font-size="22">never trimmed or compacted</text>

    <rect x="120" y="370" width="540" height="120" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="150" y="420" font-size="28" font-weight="600">summary  (optional)</text>
    <text x="150" y="462" font-size="22">empty until the first compaction</text>

    <rect x="120" y="510" width="540" height="120" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="150" y="560" font-size="28" font-weight="600">messages</text>
    <text x="150" y="602" font-size="22">questions, tool rounds, replies</text>

    <rect x="120" y="650" width="540" height="120" rx="14" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    <text x="150" y="700" font-size="28" font-weight="600">compactions</text>
    <text x="150" y="742" font-size="22">a counter for the step log</text>

    <!-- to_messages -->
    <rect x="820" y="400" width="300" height="100" rx="50" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="970" y="460" font-size="28" font-weight="600" text-anchor="middle">to_messages()</text>
    <path d="M660 290 C 760 290, 760 430, 816 440" fill="none" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M660 430 C 740 430, 760 445, 816 450" fill="none" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M660 570 C 760 570, 760 470, 816 460" fill="none" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="820" y="560" font-size="22">one opening user message:</text>
    <text x="820" y="592" font-size="22">task + summary in &lt;data&gt;</text>
    <text x="820" y="624" font-size="22">+ first kept question,</text>
    <text x="820" y="656" font-size="22">then the rest, in order</text>

    <!-- outputs -->
    <rect x="1220" y="250" width="300" height="110" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1370" y="300" font-size="28" font-weight="600" text-anchor="middle">count_tokens</text>
    <text x="1370" y="336" font-size="22" text-anchor="middle">measure the history</text>

    <rect x="1220" y="540" width="300" height="110" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1370" y="590" font-size="28" font-weight="600" text-anchor="middle">Model call</text>
    <text x="1370" y="626" font-size="22" text-anchor="middle">via the model client</text>

    <path d="M1120 430 C 1170 430, 1170 305, 1216 305" fill="none" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1120 470 C 1170 470, 1170 595, 1216 595" fill="none" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
