<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Streaming: text first, stop reason and usage last</title>
  <desc id="d">Sequence of a streamed call. The CLI calls stream on the adapter, which sends the request. The API sends message_start, content_block_start, then repeated content_block_delta events; the adapter yields each text chunk to the CLI, which prints it. Then come content_block_stop, message_delta carrying the stop reason and usage, and message_stop. Only then does the adapter yield the final ModelResponse, and the CLI prints the footer with the cost.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="90" font-size="40" font-weight="600">A stream delivers text first and the stop reason last</text>

    <rect x="140" y="130" width="260" height="70" rx="35" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="270" y="176" font-size="28" font-weight="600" text-anchor="middle">CLI</text>
    <rect x="670" y="130" width="260" height="70" rx="35" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="800" y="176" font-size="28" font-weight="600" text-anchor="middle">Adapter</text>
    <rect x="1200" y="130" width="260" height="70" rx="35" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1330" y="176" font-size="28" font-weight="600" text-anchor="middle">Messages API</text>
    <g stroke="#334155" stroke-width="2" stroke-dasharray="8 8">
      <line x1="270" y1="204" x2="270" y2="860"/>
      <line x1="800" y1="204" x2="800" y2="860"/>
      <line x1="1330" y1="204" x2="1330" y2="860"/>
    </g>

    <g stroke="#CBD5E1" stroke-width="3" fill="none">
      <line x1="272" y1="250" x2="790" y2="250" marker-end="url(#arrow)"/>
      <line x1="802" y1="290" x2="1320" y2="290" marker-end="url(#arrow)"/>
    </g>
    <text x="530" y="238" font-size="22" text-anchor="middle">stream(messages)</text>
    <text x="1065" y="278" font-size="22" text-anchor="middle">request</text>

    <g stroke="#CBD5E1" stroke-width="2" fill="none" stroke-dasharray="10 6">
      <line x1="1328" y1="335" x2="810" y2="335" marker-end="url(#arrow)"/>
      <line x1="1328" y1="380" x2="810" y2="380" marker-end="url(#arrow)"/>
      <line x1="1328" y1="460" x2="810" y2="460" marker-end="url(#arrow)"/>
      <line x1="1328" y1="605" x2="810" y2="605" marker-end="url(#arrow)"/>
      <line x1="1328" y1="720" x2="810" y2="720" marker-end="url(#arrow)"/>
    </g>
    <g stroke="#F59E0B" stroke-width="3" fill="none" stroke-dasharray="10 6">
      <line x1="1328" y1="662" x2="810" y2="662" marker-end="url(#arrow)"/>
    </g>
    <g font-size="22" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">
      <text x="1065" y="325">message_start</text>
      <text x="1065" y="370">content_block_start</text>
      <text x="1065" y="450">content_block_delta</text>
      <text x="1065" y="595">content_block_stop</text>
      <text x="1065" y="652" fill="#F59E0B">message_delta: stop reason, usage</text>
      <text x="1065" y="710">message_stop</text>
    </g>

    <rect x="200" y="404" width="1360" height="150" rx="14" fill="none" stroke="#6366F1" stroke-width="2"/>
    <text x="220" y="434" font-size="22" font-weight="600">loop while text arrives</text>
    <line x1="798" y1="510" x2="280" y2="510" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="530" y="498" font-size="22" text-anchor="middle">yield text chunk, print it</text>

    <line x1="798" y1="780" x2="280" y2="780" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="530" y="768" font-size="22" text-anchor="middle">yield final ModelResponse</text>
    <rect x="90" y="805" width="360" height="54" rx="27" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="270" y="840" font-size="22" text-anchor="middle">print footer with cost</text>
  </g>
</svg>
