<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">The dispatcher's four checks</title>
  <desc id="d">Flowchart of ToolRegistry.dispatch. A ToolCall with an id enters. Check 1: is the name registered? If not, an error result listing the available tools. Check 2: do the arguments validate against the args model? If not, an error result with pydantic's field errors. Check 3: does the function run? A ToolError passes its message through; any other exception becomes a short sanitised message and the traceback goes to the log. Otherwise, success: the output as JSON, escaped, capped and wrapped in data tags. All four outcomes are ToolResults carrying the call's id; the three failures set is_error. dispatch never raises.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="88" font-size="40" font-weight="600">dispatch(call): every path ends in a result with call.id</text>

    <!-- input -->
    <rect x="60" y="300" width="230" height="110" rx="55" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="175" y="348" font-size="26" font-weight="600" text-anchor="middle">ToolCall</text>
    <text x="175" y="382" font-size="22" text-anchor="middle">id, name, args</text>

    <!-- checks -->
    <rect x="360" y="290" width="270" height="130" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="495" y="340" font-size="26" font-weight="600" text-anchor="middle">1. Known name?</text>
    <text x="495" y="378" font-size="22" text-anchor="middle">registry lookup</text>

    <rect x="700" y="290" width="270" height="130" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="835" y="340" font-size="26" font-weight="600" text-anchor="middle">2. Valid args?</text>
    <text x="835" y="378" font-size="22" text-anchor="middle">args model</text>

    <rect x="1040" y="290" width="270" height="130" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="1175" y="340" font-size="26" font-weight="600" text-anchor="middle">3. Function runs?</text>
    <text x="1175" y="378" font-size="22" text-anchor="middle">call it</text>

    <g stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <line x1="290" y1="355" x2="352" y2="355"/>
      <line x1="630" y1="355" x2="692" y2="355"/>
      <line x1="970" y1="355" x2="1032" y2="355"/>
      <line x1="1310" y1="355" x2="1372" y2="355"/>
    </g>
    <text x="661" y="338" font-size="22" text-anchor="middle">yes</text>
    <text x="1001" y="338" font-size="22" text-anchor="middle">yes</text>
    <text x="1341" y="338" font-size="22" text-anchor="middle">yes</text>

    <!-- success -->
    <rect x="1376" y="270" width="200" height="170" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1476" y="318" font-size="26" font-weight="600" text-anchor="middle">4. Success</text>
    <text x="1476" y="356" font-size="22" text-anchor="middle">JSON, escaped,</text>
    <text x="1476" y="386" font-size="22" text-anchor="middle">capped, in</text>
    <text x="1476" y="416" font-size="22" text-anchor="middle">&lt;data&gt; tags</text>

    <!-- failure arrows -->
    <g stroke="#F43F5E" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <line x1="495" y1="420" x2="495" y2="532"/>
      <line x1="835" y1="420" x2="835" y2="532"/>
      <line x1="1175" y1="420" x2="1175" y2="532"/>
    </g>
    <text x="515" y="485" font-size="22">no</text>
    <text x="855" y="485" font-size="22">no</text>
    <text x="1195" y="485" font-size="22">raises</text>

    <rect x="360" y="540" width="270" height="130" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <text x="495" y="590" font-size="24" font-weight="600" text-anchor="middle">Error result</text>
    <text x="495" y="628" font-size="22" text-anchor="middle">lists known tools</text>

    <rect x="700" y="540" width="270" height="130" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <text x="835" y="590" font-size="24" font-weight="600" text-anchor="middle">Error result</text>
    <text x="835" y="628" font-size="22" text-anchor="middle">field-by-field errors</text>

    <rect x="1040" y="540" width="270" height="130" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <text x="1175" y="584" font-size="24" font-weight="600" text-anchor="middle">Error result</text>
    <text x="1175" y="620" font-size="22" text-anchor="middle">ToolError: its text</text>
    <text x="1175" y="652" font-size="22" text-anchor="middle">else: sanitised + log</text>

    <!-- footer -->
    <rect x="360" y="730" width="1200" height="96" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="960" y="772" font-size="24" font-weight="600" text-anchor="middle">Every outcome is a ToolResult with tool_call_id = call.id</text>
    <text x="960" y="806" font-size="22" text-anchor="middle">failures set is_error · dispatch never raises into the caller</text>
  </g>
</svg>
