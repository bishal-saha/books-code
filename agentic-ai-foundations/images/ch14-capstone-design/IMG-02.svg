<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">The file sandbox's path check</title>
  <desc id="d">Flowchart of resolve_in_sandbox. The path argument comes from the model. If it is absolute, it is rejected. Otherwise the root joined with the path is resolved, following symlinks and collapsing dot-dot segments. If the resolved path is not inside the resolved root, it is rejected. If it is not a regular file, it is rejected with the list of files. Only then is the file read or counted. Every rejection is a SandboxError, which the registry returns to the model as a tool result with is_error true.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="76" font-size="40" font-weight="600">Resolve first, then compare: the sandbox check</text>

    <rect x="80" y="170" width="300" height="100" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="230" y="212" font-size="25" font-weight="600" text-anchor="middle">path argument</text>
    <text x="230" y="246" font-size="21" text-anchor="middle" fill="#94A3B8">chosen by the model</text>

    <polygon points="600,150 760,220 600,290 440,220" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="600" y="228" font-size="24" font-weight="600" text-anchor="middle">absolute?</text>

    <rect x="840" y="170" width="330" height="100" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1005" y="212" font-size="24" font-weight="600" text-anchor="middle">resolve root / path</text>
    <text x="1005" y="246" font-size="21" text-anchor="middle" fill="#94A3B8">follows symlinks and ..</text>

    <polygon points="1005,340 1215,420 1005,500 795,420" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1005" y="414" font-size="23" font-weight="600" text-anchor="middle">inside the</text>
    <text x="1005" y="442" font-size="23" font-weight="600" text-anchor="middle">resolved root?</text>

    <polygon points="1005,560 1175,630 1005,700 835,630" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1005" y="638" font-size="23" font-weight="600" text-anchor="middle">regular file?</text>

    <rect x="1250" y="740" width="270" height="90" rx="16" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1385" y="795" font-size="25" font-weight="600" text-anchor="middle">read or count</text>

    <rect x="200" y="520" width="440" height="140" rx="16" fill="#1E293B" stroke="#F43F5E" stroke-width="3"/>
    <text x="420" y="572" font-size="25" font-weight="600" text-anchor="middle">SandboxError</text>
    <text x="420" y="608" font-size="21" text-anchor="middle" fill="#94A3B8">returned as a tool result,</text>
    <text x="420" y="636" font-size="21" text-anchor="middle" fill="#94A3B8">is_error=True; nothing is read</text>

    <line x1="380" y1="220" x2="432" y2="220" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>
    <line x1="760" y1="220" x2="832" y2="220" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>
    <text x="796" y="204" font-size="21" text-anchor="middle" fill="#5EEAD4">no</text>
    <line x1="1005" y1="270" x2="1005" y2="332" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1005" y1="500" x2="1005" y2="552" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>
    <text x="1030" y="532" font-size="21" fill="#5EEAD4">yes</text>
    <path d="M1175 630 H1385 V732" fill="none" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>
    <text x="1260" y="614" font-size="21" fill="#5EEAD4">yes</text>

    <path d="M600 290 V480 H500 V512" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#a)"/>
    <text x="585" y="400" font-size="21" text-anchor="end" fill="#FDA4AF">yes: /etc/passwd</text>
    <path d="M795 420 H700 V560 H648" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#a)"/>
    <text x="715" y="475" font-size="21" fill="#FDA4AF">no: ../kestrel.sqlite,</text>
    <text x="715" y="503" font-size="21" fill="#FDA4AF">latest.csv symlink</text>
    <path d="M1005 700 V780 H420 V668" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#a)"/>
    <text x="720" y="770" font-size="21" text-anchor="middle" fill="#FDA4AF">no: missing file, a folder</text>
  </g>
</svg>
