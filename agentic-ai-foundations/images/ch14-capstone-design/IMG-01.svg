<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">The research assistant's read-only reach</title>
  <desc id="d">Architecture diagram. A question with an optional today date goes from the command line into the agent loop, which runs under a run budget of steps, tokens, wall time and money. The loop calls the model client and the tool registry. The registry holds four tools. search_web reads the public web through a search service. read_file and count_rows read only the sandboxed folder .kestrel/exports. calculate has no input or output. Outside the sandbox, crossed off, are the SQLite database, the Markdown docs and the mock API: no tool reaches them. Every arrow reads; nothing writes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="76" font-size="40" font-weight="600">Point 4: narrow tools, read-only reach, a tight budget</text>

    <rect x="80" y="150" width="260" height="96" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="210" y="192" font-size="26" font-weight="600" text-anchor="middle">Command line</text>
    <text x="210" y="226" font-size="21" text-anchor="middle" fill="#94A3B8">question, --today</text>

    <rect x="420" y="130" width="420" height="250" rx="18" fill="#111C3D" stroke="#F43F5E" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="630" y="166" font-size="22" text-anchor="middle" fill="#FDA4AF">run budget: steps, tokens, time, money</text>
    <rect x="470" y="190" width="320" height="90" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="630" y="245" font-size="28" font-weight="600" text-anchor="middle">Agent loop</text>

    <rect x="960" y="190" width="300" height="90" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1110" y="245" font-size="26" font-weight="600" text-anchor="middle">Model client</text>

    <line x1="340" y1="198" x2="462" y2="230" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>
    <line x1="790" y1="235" x2="952" y2="235" stroke="#CBD5E1" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>

    <rect x="470" y="440" width="320" height="80" rx="16" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="630" y="490" font-size="26" font-weight="600" text-anchor="middle">Tool registry</text>
    <line x1="630" y1="280" x2="630" y2="432" stroke="#CBD5E1" stroke-width="3" marker-end="url(#a)"/>

    <rect x="80" y="600" width="270" height="76" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="215" y="647" font-size="25" font-weight="600" text-anchor="middle">search_web</text>
    <rect x="390" y="600" width="230" height="76" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="505" y="647" font-size="25" font-weight="600" text-anchor="middle">read_file</text>
    <rect x="660" y="600" width="250" height="76" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="785" y="647" font-size="25" font-weight="600" text-anchor="middle">count_rows</text>
    <rect x="950" y="600" width="250" height="76" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1075" y="647" font-size="25" font-weight="600" text-anchor="middle">calculate</text>
    <line x1="560" y1="520" x2="240" y2="592" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="600" y1="520" x2="515" y2="592" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="660" y1="520" x2="770" y2="592" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="700" y1="520" x2="1050" y2="592" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="80" y="760" width="270" height="80" rx="14" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <text x="215" y="808" font-size="23" text-anchor="middle">Public web</text>
    <line x1="215" y1="676" x2="215" y2="752" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="390" y="760" width="520" height="80" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="650" y="799" font-size="23" font-weight="600" text-anchor="middle">.kestrel/exports</text>
    <text x="650" y="827" font-size="20" text-anchor="middle" fill="#FCD34D">the file sandbox</text>
    <line x1="505" y1="676" x2="505" y2="752" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="785" y1="676" x2="785" y2="752" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="1075" y="720" font-size="21" text-anchor="middle" fill="#94A3B8">no I/O</text>

    <rect x="1280" y="440" width="260" height="400" rx="16" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="1410" y="482" font-size="22" font-weight="600" text-anchor="middle" fill="#FDA4AF">Out of reach</text>
    <text x="1410" y="560" font-size="22" text-anchor="middle">kestrel.sqlite</text>
    <text x="1410" y="640" font-size="22" text-anchor="middle">docs/*.md</text>
    <text x="1410" y="720" font-size="22" text-anchor="middle">mock API</text>
    <text x="1410" y="800" font-size="20" text-anchor="middle" fill="#94A3B8">no tool, no write</text>
  </g>
</svg>
