<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Four Kestrel systems on the autonomy spectrum, with their build-or-adopt outcome</title>
<desc id="d">The autonomy spectrum runs left to right through five points: workflow with no model step, single model call, workflow with model steps, agent with narrow tools and a tight budget, agent with a wider tool set. Priya's expense claims sit at point 3, workflow with model steps: no framework. Tomasz's late-shipment agent and Sam's research assistant (the capstone) sit at point 4: build, keep the hand-written loop, because neither has a persistence, hook or graph need. Maya's return authorisations sit at point 5, with one write and a human approval step: adopt on condition, LangGraph with a persistent checkpointer if a spike passes the hard gates, otherwise build.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="1600" height="900" rx="24" fill="#0B1530"/>
<g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
<text x="70" y="80" font-size="40" font-weight="600">Same checklist, different answers</text>
<text x="70" y="124" font-size="24" fill="#94A3B8">Where each system sits on the autonomy spectrum, and what the checklist decided</text>
<line x1="110" y1="250" x2="1510" y2="250" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/>
<line x1="750" y1="264" x2="330" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1040" y1="264" x2="910" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1040" y1="264" x2="910" y2="570" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1330" y1="264" x2="1360" y2="330" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
<circle cx="170" cy="250" r="12" fill="#6366F1"/>
<text x="170" y="194" font-size="22" font-weight="600" text-anchor="middle">1 Workflow,</text>
<text x="170" y="222" font-size="22" text-anchor="middle" fill="#94A3B8">no model step</text>
<circle cx="460" cy="250" r="12" fill="#6366F1"/>
<text x="460" y="194" font-size="22" font-weight="600" text-anchor="middle">2 Single</text>
<text x="460" y="222" font-size="22" text-anchor="middle" fill="#94A3B8">model call</text>
<circle cx="750" cy="250" r="12" fill="#6366F1"/>
<text x="750" y="194" font-size="22" font-weight="600" text-anchor="middle">3 Workflow with</text>
<text x="750" y="222" font-size="22" text-anchor="middle" fill="#94A3B8">model steps</text>
<circle cx="1040" cy="250" r="12" fill="#6366F1"/>
<text x="1040" y="194" font-size="22" font-weight="600" text-anchor="middle">4 Agent, narrow</text>
<text x="1040" y="222" font-size="22" text-anchor="middle" fill="#94A3B8">tools, tight budget</text>
<circle cx="1330" cy="250" r="12" fill="#6366F1"/>
<text x="1330" y="194" font-size="22" font-weight="600" text-anchor="middle">5 Agent, wider</text>
<text x="1330" y="222" font-size="22" text-anchor="middle" fill="#94A3B8">tool set</text>
<rect x="70" y="330" width="520" height="200" rx="18" fill="#111C3A" stroke="#6366F1" stroke-width="3"/>
<text x="94" y="374" font-size="26" font-weight="600" fill="#E2E8F0">Priya's expense claims</text>
<text x="94" y="410" font-size="21" fill="#94A3B8">Code fixes the sequence;</text>
<text x="94" y="440" font-size="21" fill="#94A3B8">nothing waits or persists</text>
<rect x="94" y="464" width="472" height="46" rx="12" fill="#6366F1" fill-opacity="0.18"/>
<text x="110" y="496" font-size="23" font-weight="600" fill="#C7D2FE">No framework (stops at Q0)</text>
<rect x="650" y="330" width="520" height="200" rx="18" fill="#111C3A" stroke="#14B8A6" stroke-width="3"/>
<text x="674" y="374" font-size="26" font-weight="600" fill="#E2E8F0">Tomasz's late shipments</text>
<text x="674" y="410" font-size="21" fill="#94A3B8">Read-only tools, one CLI run;</text>
<text x="674" y="440" font-size="21" fill="#94A3B8">no Q1 need</text>
<rect x="674" y="464" width="472" height="46" rx="12" fill="#14B8A6" fill-opacity="0.18"/>
<text x="690" y="496" font-size="23" font-weight="600" fill="#99F6E4">Build: keep run_agent</text>
<rect x="650" y="570" width="520" height="200" rx="18" fill="#111C3A" stroke="#14B8A6" stroke-width="3"/>
<text x="674" y="614" font-size="26" font-weight="600" fill="#E2E8F0">Sam's research assistant</text>
<text x="674" y="650" font-size="21" fill="#94A3B8">Capstone: one question per run,</text>
<text x="674" y="680" font-size="21" fill="#94A3B8">short-term state only</text>
<rect x="674" y="704" width="472" height="46" rx="12" fill="#14B8A6" fill-opacity="0.18"/>
<text x="690" y="736" font-size="23" font-weight="600" fill="#99F6E4">Build: decisions/capstone.md</text>
<rect x="1230" y="330" width="300" height="440" rx="18" fill="#111C3A" stroke="#F59E0B" stroke-width="3"/>
<text x="1254" y="374" font-size="26" font-weight="600" fill="#E2E8F0">Maya's returns</text>
<text x="1254" y="410" font-size="21" fill="#94A3B8">One write and a</text>
<text x="1254" y="440" font-size="21" fill="#94A3B8">human approval;</text>
<text x="1254" y="470" font-size="21" fill="#94A3B8">must resume after</text>
<text x="1254" y="500" font-size="21" fill="#94A3B8">a restart</text>
<text x="1254" y="560" font-size="21" fill="#94A3B8">Candidate: LangGraph</text>
<text x="1254" y="590" font-size="21" fill="#94A3B8">with a persistent</text>
<text x="1254" y="620" font-size="21" fill="#94A3B8">checkpointer</text>
<rect x="1254" y="654" width="252" height="92" rx="12" fill="#F59E0B" fill-opacity="0.18"/>
<text x="1270" y="692" font-size="23" font-weight="600" fill="#FDE68A">Adopt, if a spike</text>
<text x="1270" y="726" font-size="23" font-weight="600" fill="#FDE68A">passes the gates</text>
<text x="70" y="840" font-size="22" fill="#94A3B8">Further right is not better: the answer follows what the system needs now, not where it sits.</text>
</g></svg>