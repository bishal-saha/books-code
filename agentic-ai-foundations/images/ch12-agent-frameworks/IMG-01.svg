<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">How much of your agent loop each framework shape takes over</title>
<desc id="d">A grid with the five parts of the agent loop as columns: model client, tool dispatch, conversation state, run budget and step log. Row one, loop helper (the Anthropic SDK tool runner): it runs the model client and tool dispatch; state and the step log stay in your code; the cited docs do not settle a budget. Row two, standalone library (OpenAI Agents SDK, Pydantic AI, LangGraph): it runs the client, dispatch and state through its own abstractions; the cited docs do not settle budget and step log for every library, so check each one. Row three, runtime (Claude Agent SDK with its bundled CLI): it runs the client, tools and state; the cited docs do not settle the budget; for the step log it runs hooks that call your code.</desc>
