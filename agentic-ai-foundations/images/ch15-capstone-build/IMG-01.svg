<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The citable set lives on the registry, outside the conversation</title>
  <desc id="d">Tool outputs pass through the registry. Each rendered result goes into the conversation history, which compaction may summarise. Only successful results also add their locations to the citable set, which sits beside the loop. The final-answer check reads the citable set, so compaction cannot change what the run may cite.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, sans-serif; fill: #CBD5E1; }
      .h { font-size: 40px; font-weight: 600; fill: #F8FAFC; }
      .l { font-size: 27px; font-weight: 600; fill: #F8FAFC; }
      .n { font-size: 22px; }
      .box { fill: #1E293B; stroke: #334155; stroke-width: 3; }
      .ln { stroke: #CBD5E1; stroke-width: 3; fill: none; stroke-linejoin: round; marker-end: url(#a); }
      .ln2 { stroke: #CBD5E1; stroke-width: 2; fill: none; stroke-dasharray: 10 8; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <text x="80" y="92" class="h">Compaction rewrites the history, never the citable set</text>

  <!-- tools -->
  <rect x="80" y="330" width="260" height="140" rx="14" class="box" stroke="#14B8A6"/>
  <rect x="80" y="330" width="260" height="10" rx="5" fill="#14B8A6"/>
  <text x="210" y="395" text-anchor="middle" class="l">Tool functions</text>
  <text x="210" y="432" text-anchor="middle" class="n">4 read-only tools</text>

  <!-- registry -->
  <rect x="440" y="320" width="300" height="160" rx="14" class="box" stroke="#6366F1"/>
  <text x="590" y="390" text-anchor="middle" class="l">Registry</text>
  <text x="590" y="428" text-anchor="middle" class="n">validate, run, render</text>
  <path d="M340 400 L432 400" class="ln"/>

  <!-- history -->
  <rect x="880" y="160" width="360" height="160" rx="14" class="box" stroke="#6366F1"/>
  <text x="1060" y="225" text-anchor="middle" class="l">Conversation history</text>
  <text x="1060" y="263" text-anchor="middle" class="n">every tool result, as rendered</text>
  <path d="M740 360 C810 360 810 240 872 240" class="ln"/>
  <text x="760" y="250" class="n">result</text>

  <!-- compaction -->
  <rect x="1320" y="160" width="220" height="160" rx="80" class="box"/>
  <text x="1430" y="232" text-anchor="middle" class="l">Compaction</text>
  <text x="1430" y="268" text-anchor="middle" class="n">summary</text>
  <path d="M1240 210 L1312 210" class="ln"/>
  <path d="M1320 280 L1248 280" class="ln"/>

  <!-- citable set (cylinder) -->
  <g>
    <path d="M880 520 v120 a180 30 0 0 0 360 0 v-120" class="box" stroke="#14B8A6"/>
    <ellipse cx="1060" cy="520" rx="180" ry="30" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1060" y="600" text-anchor="middle" class="l">Citable set</text>
    <text x="1060" y="638" text-anchor="middle" class="n">URLs and file names</text>
  </g>
  <path d="M740 440 C810 440 810 580 872 580" class="ln"/>
  <text x="785" y="540" text-anchor="end" class="n">success only</text>

  <!-- checker -->
  <rect x="1320" y="520" width="220" height="140" rx="14" class="box" stroke="#F59E0B"/>
  <text x="1430" y="582" text-anchor="middle" class="l">Final-answer</text>
  <text x="1430" y="618" text-anchor="middle" class="l">check</text>
  <path d="M1240 590 L1312 590" class="ln"/>

  <text x="1430" y="362" text-anchor="middle" class="n">changes only</text>
  <text x="1430" y="390" text-anchor="middle" class="n">the history</text>

  <text x="80" y="790" class="n">Error results (a refused path, a timed-out search) reach the history but add nothing to the citable set.</text>
  <text x="80" y="830" class="n">calculate adds nothing either: a computed number has no location of its own.</text>
</svg>
