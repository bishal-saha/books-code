<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">A tool-call parser mismatch looks like a finished run</title>
  <desc id="d">Flowchart. A self-hosted model emits its tool call as text, and the inference server's parser must turn it into structured tool_calls. If the parser matches the model, the loop runs the tool and the task check runs as usual. If it does not match, the call stays plain text with empty tool_calls, the response ends with finish_reason stop, and run_agent stops with StopCause finished. The harness then asks whether the required tools appear in the step log. They do not, so the run is recorded as a failure: no required tool call.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="84" font-size="40" font-weight="600">A parser mismatch looks like a finished run</text>

    <!-- row 1 -->
    <rect x="80" y="170" width="340" height="110" rx="55" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="250" y="218" font-size="26" font-weight="600" text-anchor="middle">Model emits a tool</text>
    <text x="250" y="252" font-size="26" font-weight="600" text-anchor="middle">call as text</text>

    <polygon points="660,145 840,225 660,305 480,225" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="660" y="218" font-size="26" font-weight="600" text-anchor="middle">Server parser</text>
    <text x="660" y="250" font-size="26" font-weight="600" text-anchor="middle">matches model?</text>

    <rect x="920" y="170" width="290" height="110" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1065" y="218" font-size="26" font-weight="600" text-anchor="middle">Structured</text>
    <text x="1065" y="252" font-size="26" font-weight="600" text-anchor="middle">tool_calls</text>

    <rect x="1270" y="170" width="250" height="110" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1395" y="218" font-size="26" font-weight="600" text-anchor="middle">Loop runs the</text>
    <text x="1395" y="252" font-size="26" font-weight="600" text-anchor="middle">tool; task checked</text>

    <!-- row 2 -->
    <rect x="480" y="440" width="360" height="110" rx="14" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    <text x="660" y="488" font-size="26" font-weight="600" text-anchor="middle">Call left as plain text,</text>
    <text x="660" y="522" font-size="26" font-weight="600" text-anchor="middle">empty tool_calls</text>

    <rect x="920" y="440" width="600" height="110" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1220" y="488" font-size="26" font-weight="600" text-anchor="middle">finish_reason "stop"</text>
    <text x="1220" y="522" font-size="26" font-weight="600" text-anchor="middle">run_agent stops: StopCause finished</text>

    <!-- row 3 -->
    <polygon points="1220,610 1440,700 1220,790 1000,700" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="1220" y="692" font-size="26" font-weight="600" text-anchor="middle">Required tools</text>
    <text x="1220" y="724" font-size="26" font-weight="600" text-anchor="middle">in step log?</text>

    <rect x="80" y="645" width="600" height="110" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="3"/>
    <text x="380" y="693" font-size="26" font-weight="600" text-anchor="middle">Recorded as a failure:</text>
    <text x="380" y="727" font-size="26" font-weight="600" text-anchor="middle">"no required tool call"</text>

    <!-- arrows -->
    <g stroke="#CBD5E1" stroke-width="3" fill="none" stroke-linejoin="round">
      <path d="M420 225 H470" marker-end="url(#arrow)"/>
      <path d="M840 225 H910" marker-end="url(#arrow)"/>
      <path d="M1210 225 H1260" marker-end="url(#arrow)"/>
      <path d="M660 305 V430" marker-end="url(#arrow)"/>
      <path d="M840 495 H910" marker-end="url(#arrow)"/>
      <path d="M1220 550 V600" marker-end="url(#arrow)"/>
      <path d="M1000 700 H690" marker-end="url(#arrow)"/>
    </g>
    <text x="875" y="208" font-size="24" text-anchor="middle">yes</text>
    <text x="690" y="378" font-size="24">no</text>
    <text x="845" y="684" font-size="24" text-anchor="middle">no</text>

    <text x="80" y="850" font-size="22">The loop reports finished; only the harness's required-tool check shows the run never looked anything up.</text>
  </g>
</svg>
