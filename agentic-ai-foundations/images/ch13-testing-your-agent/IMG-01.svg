<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">The trace recorder observes every event of a run</title>
  <desc id="d">Sequence diagram with six participants: the caller (eval.py or a test), run_agent, the model client, the tool registry, the TraceRecorder and the trace file. The caller writes run_start to the recorder, then calls run_agent with the recorder. In each step run_agent calls the model client, gets a response with usage, and reports model_call to the recorder; it dispatches each tool call to the registry, gets a result or an error result, and reports tool_call. When the run ends, run_agent reports run_end with the StopCause and output. For every event the recorder appends one JSONL line to the trace file and flushes it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="72" font-size="40" font-weight="600">The recorder observes; the caller writes run_start</text>
    <rect x="50" y="110" width="200" height="64" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="150" y="152" font-size="26" font-weight="600" text-anchor="middle">Caller</text>
    <line x1="150" y1="174" x2="150" y2="820" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="350" y="110" width="200" height="64" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="450" y="152" font-size="26" font-weight="600" text-anchor="middle">run_agent</text>
    <line x1="450" y1="174" x2="450" y2="820" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="635" y="110" width="230" height="64" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="750" y="152" font-size="26" font-weight="600" text-anchor="middle">Model client</text>
    <line x1="750" y1="174" x2="750" y2="820" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="915" y="110" width="230" height="64" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1030" y="152" font-size="26" font-weight="600" text-anchor="middle">Tool registry</text>
    <line x1="1030" y1="174" x2="1030" y2="820" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="1185" y="110" width="230" height="64" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1300" y="152" font-size="26" font-weight="600" text-anchor="middle">TraceRecorder</text>
    <line x1="1300" y1="174" x2="1300" y2="820" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M1420 122 v52 a75 14 0 0 0 150 0 v-52" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <ellipse cx="1495" cy="122" rx="75" ry="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1495" y="172" font-size="22" font-weight="600" text-anchor="middle">run.jsonl</text>
    <line x1="1495" y1="190" x2="1495" y2="820" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="320" y="338" width="1120" height="352" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="336" y="368" font-size="22" font-weight="600" fill="#F59E0B">each step</text>
    <line x1="150" y1="240" x2="1294" y2="240" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="725" y="228" font-size="22" text-anchor="middle">run_start: task, prompt version, budget</text>
    <line x1="1300" y1="240" x2="1489" y2="240" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1398" y="228" font-size="20" text-anchor="middle" fill="#14B8A6">append + flush</text>
    <line x1="150" y1="305" x2="444" y2="305" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="300" y="293" font-size="22" text-anchor="middle">run_agent(…, recorder)</text>
    <line x1="450" y1="410" x2="744" y2="410" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="398" font-size="22" text-anchor="middle">complete()</text>
    <line x1="750" y1="460" x2="456" y2="460" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
    <text x="600" y="448" font-size="22" text-anchor="middle">response + usage</text>
    <line x1="450" y1="520" x2="1294" y2="520" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="875" y="508" font-size="22" text-anchor="middle">model_call: tokens, cost, text</text>
    <line x1="1300" y1="520" x2="1489" y2="520" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="585" x2="1024" y2="585" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="740" y="573" font-size="22" text-anchor="middle">dispatch(call)</text>
    <line x1="1030" y1="630" x2="456" y2="630" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
    <text x="740" y="618" font-size="22" text-anchor="middle">result or is_error</text>
    <line x1="450" y1="675" x2="1294" y2="675" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="875" y="663" font-size="22" text-anchor="middle">tool_call: args, full content</text>
    <line x1="1300" y1="675" x2="1489" y2="675" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="760" x2="1294" y2="760" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="875" y="748" font-size="22" text-anchor="middle">run_end: StopCause, output</text>
    <line x1="1300" y1="760" x2="1489" y2="760" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="80" y="868" font-size="22">One line per event, written as it happens: a run that crashes still leaves a readable trace.</text>
  </g>
</svg>
