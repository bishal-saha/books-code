<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Capping a tool result keeps its origin in the header</title>
  <desc id="d">A raw tool result, from a file path, a URL or a tool call, is compared with the character cap. Under the cap it passes through whole. Over the cap it keeps its head and tail with a marker naming the omitted range, and read_doc can fetch that range with an offset. Far over the cap, a tool may opt in to summarise_result, an extra model call that falls back to the cap if it fails. Shaped JSON over the cap is never cut: it comes back as an error result. Every other path ends with the same output: a header line with origin, shown ranges and the truncated or summarised flag, then the content inside data tags, going into the context window.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="88" font-size="40" font-weight="600">Whatever path a result takes, its origin stays attached</text>

    <rect x="80" y="380" width="300" height="130" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="230" y="432" font-size="28" font-weight="600" text-anchor="middle">Raw tool result</text>
    <text x="230" y="472" font-size="22" text-anchor="middle">path, URL or tool call</text>

    <path d="M380 445 L450 445" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <polygon points="560,355 670,445 560,535 450,445" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="560" y="438" font-size="24" font-weight="600" text-anchor="middle">Size vs</text>
    <text x="560" y="468" font-size="24" font-weight="600" text-anchor="middle">cap</text>

    <!-- branches -->
    <g stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M560 355 L560 210 L750 210"/>
      <path d="M670 445 L750 445"/>
      <path d="M560 535 L560 680 L750 680"/>
      <path d="M560 680 L560 825 L750 825" stroke-dasharray="10 8"/>
    </g>
    <text x="580" y="790" font-size="22">shaped JSON</text>
    <text x="580" y="250" font-size="22">under</text>
    <text x="684" y="430" font-size="22">over</text>
    <text x="580" y="630" font-size="22">far over</text>

    <rect x="760" y="160" width="400" height="100" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="960" y="220" font-size="26" font-weight="600" text-anchor="middle">Pass through whole</text>

    <rect x="760" y="380" width="400" height="130" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="960" y="430" font-size="26" font-weight="600" text-anchor="middle">Head + tail + marker</text>
    <text x="960" y="470" font-size="22" text-anchor="middle">offset reads the gap</text>

    <rect x="760" y="615" width="400" height="130" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="960" y="665" font-size="26" font-weight="600" text-anchor="middle">summarise_result</text>
    <text x="960" y="705" font-size="22" text-anchor="middle">opt-in; falls back to the cap</text>

    <rect x="760" y="790" width="400" height="70" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="3"/>
    <text x="960" y="834" font-size="22" text-anchor="middle">JSON over cap: error result</text>

    <g stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M1160 210 L1250 210 L1250 380"/>
      <path d="M1160 445 L1240 445"/>
      <path d="M1160 680 L1250 680 L1250 520"/>
    </g>

    <rect x="1250" y="390" width="290" height="120" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1395" y="432" font-size="22" font-weight="600" text-anchor="middle">[origin | shown |</text>
    <text x="1395" y="462" font-size="22" font-weight="600" text-anchor="middle">truncated]</text>
    <text x="1395" y="492" font-size="22" text-anchor="middle">&lt;data&gt;…&lt;/data&gt;</text>
    <text x="1395" y="560" font-size="22" text-anchor="middle">into the context</text>
    <text x="1395" y="590" font-size="22" text-anchor="middle">window</text>
  </g>
</svg>
