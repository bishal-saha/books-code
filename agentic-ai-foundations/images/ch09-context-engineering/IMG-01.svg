<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Every step rebuilds the model's input from four components</title>
  <desc id="d">On the left, four components: the system prompt and the tool definitions, both fixed for the run; the history, which grows each step; and the tool results so far, whose size the data decides. All four flow into the context window for this step, which also holds the reserved output (max output tokens). The window goes to the model call. When the model asks for tools, the tools run and their results and the tool call are added to tool results and history, and the next step sends everything again. Note: the model keeps nothing between steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="88" font-size="40" font-weight="600">Every step sends the whole package again</text>

    <!-- components -->
    <rect x="80" y="160" width="400" height="110" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="110" y="208" font-size="28" font-weight="600">System prompt</text>
    <text x="110" y="246" font-size="22">fixed per run</text>

    <rect x="80" y="300" width="400" height="110" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="110" y="348" font-size="28" font-weight="600">Tool definitions</text>
    <text x="110" y="386" font-size="22">fixed per run</text>

    <rect x="80" y="440" width="400" height="110" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="110" y="488" font-size="28" font-weight="600">History</text>
    <text x="110" y="526" font-size="22">grows each step</text>

    <rect x="80" y="580" width="400" height="110" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="110" y="628" font-size="28" font-weight="600">Tool results so far</text>
    <text x="110" y="666" font-size="22">size set by the data</text>

    <!-- arrows into window -->
    <g stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M480 215 L640 215"/>
      <path d="M480 355 L640 355"/>
      <path d="M480 495 L640 495"/>
      <path d="M480 635 L640 635"/>
    </g>

    <!-- window -->
    <rect x="650" y="150" width="380" height="640" rx="14" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="840" y="138" font-size="26" font-weight="600" text-anchor="middle">Context window, this step</text>
    <rect x="680" y="175" width="320" height="80" rx="10" fill="#6366F1" fill-opacity="0.35" stroke="#6366F1" stroke-width="2"/>
    <text x="840" y="224" font-size="24" text-anchor="middle">system</text>
    <rect x="680" y="270" width="320" height="110" rx="10" fill="#6366F1" fill-opacity="0.35" stroke="#6366F1" stroke-width="2"/>
    <text x="840" y="333" font-size="24" text-anchor="middle">tools</text>
    <rect x="680" y="395" width="320" height="60" rx="10" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="2"/>
    <text x="840" y="434" font-size="24" text-anchor="middle">history</text>
    <rect x="680" y="470" width="320" height="180" rx="10" fill="#14B8A6" fill-opacity="0.3" stroke="#14B8A6" stroke-width="2"/>
    <text x="840" y="568" font-size="24" text-anchor="middle">tool results</text>
    <rect x="680" y="665" width="320" height="100" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="840" y="708" font-size="22" text-anchor="middle">reserved output</text>
    <text x="840" y="740" font-size="22" text-anchor="middle">(max output tokens)</text>

    <!-- model call and tools -->
    <path d="M1030 470 L1150 470" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="1160" y="420" width="360" height="100" rx="50" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1340" y="480" font-size="28" font-weight="600" text-anchor="middle">Model call</text>

    <path d="M1340 520 L1340 620" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="1160" y="630" width="360" height="100" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1340" y="690" font-size="28" font-weight="600" text-anchor="middle">Tools run</text>

    <path d="M1340 730 L1340 830 L280 830 L280 700" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="810" y="868" font-size="22" text-anchor="middle">calls and results join the next step's request</text>

    <text x="1340" y="300" font-size="24" text-anchor="middle">The model keeps nothing</text>
    <text x="1340" y="334" font-size="24" text-anchor="middle">between steps</text>
  </g>
</svg>
