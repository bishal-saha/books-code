<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The money check before each model call, the charge after it</title>
  <desc id="d">Before each model call the agent loop asks the budget tracker how many output tokens the money left can pay for after the estimated input. If fewer than 256, the run stops with cost_limit and no call is sent. Otherwise the loop sends the call with its output cap shrunk to that number, the model client returns usage, and the tracker charges the actual input and output tokens at the configured prices. Search requests are charged by the tracker when they are sent.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, sans-serif; fill: #CBD5E1; }
      .h { font-size: 40px; font-weight: 600; fill: #F8FAFC; }
      .l { font-size: 27px; font-weight: 600; fill: #F8FAFC; }
      .n { font-size: 22px; }
      .box { fill: #1E293B; stroke-width: 3; }
      .life { stroke: #334155; stroke-width: 2; stroke-dasharray: 8 8; }
      .ln { stroke: #CBD5E1; stroke-width: 3; fill: none; marker-end: url(#a); }
      .rt { stroke: #CBD5E1; stroke-width: 2; fill: none; stroke-dasharray: 10 8; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <text x="80" y="92" class="h">Check the worst case before the call, charge the usage after</text>

  <!-- lifeline heads -->
  <rect x="120" y="140" width="300" height="80" rx="14" class="box" stroke="#6366F1"/>
  <text x="270" y="190" text-anchor="middle" class="l">Agent loop</text>
  <rect x="650" y="140" width="300" height="80" rx="14" class="box" stroke="#F59E0B"/>
  <text x="800" y="190" text-anchor="middle" class="l">BudgetTracker</text>
  <rect x="1180" y="140" width="300" height="80" rx="14" class="box" stroke="#6366F1"/>
  <text x="1330" y="190" text-anchor="middle" class="l">Model client</text>
  <line x1="270" y1="220" x2="270" y2="840" class="life"/>
  <line x1="800" y1="220" x2="800" y2="840" class="life"/>
  <line x1="1330" y1="220" x2="1330" y2="840" class="life"/>

  <!-- 1 ask -->
  <path d="M270 290 L792 290" class="ln"/>
  <text x="300" y="275" class="n">1  how many output tokens can it pay for?</text>

  <!-- 2a stop -->
  <path d="M800 370 L278 370" class="rt"/>
  <rect x="300" y="390" width="440" height="70" rx="35" class="box" stroke="#F43F5E"/>
  <text x="520" y="434" text-anchor="middle" class="n">fewer than 256: stop with cost_limit</text>
  <text x="560" y="355" class="n">2a  not enough</text>

  <!-- 2b send -->
  <path d="M270 530 L1322 530" class="ln"/>
  <text x="300" y="515" class="n">2b  enough: send the call, output cap shrunk to fit</text>

  <!-- 3 usage -->
  <path d="M1330 610 L278 610" class="rt"/>
  <text x="900" y="595" class="n">3  reply with usage</text>

  <!-- 4 charge -->
  <path d="M270 690 L792 690" class="ln"/>
  <text x="300" y="675" class="n">4  charge actual tokens at models.toml prices</text>

  <!-- search note -->
  <rect x="840" y="720" width="640" height="100" rx="14" class="box" stroke="#14B8A6"/>
  <text x="1160" y="762" text-anchor="middle" class="n">search_web: each request is charged</text>
  <text x="1160" y="794" text-anchor="middle" class="n">when sent, at SEARCH_USD_PER_QUERY</text>
</svg>
