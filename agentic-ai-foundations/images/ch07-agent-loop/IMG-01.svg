<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Every exit from the agent loop has a name</title>
  <desc id="d">Decision tree for one step of run_agent. A step starts and the budget check runs first: if the token or time limit is hit, the run ends with TOKEN_LIMIT or TIME_LIMIT. If there is room, the model call runs with its timeout and output cap shrunk to fit; if it raises ModelError the run ends with MODEL_ERROR. Otherwise the stop reason decides. tool_call runs the tools, appends the results and starts the next step while steps are left; when the step range is used up the run ends with STEP_LIMIT. finished ends with FINISHED, the only answer. truncated ends with TRUNCATED, or TOKEN_LIMIT when the budget's remainder set the cap. other, or tool_call with no calls, ends with UNEXPECTED_STOP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="80" font-size="40" font-weight="600">Every exit from the loop has a name</text>

    <!-- boxes -->
    <rect x="80" y="130" width="380" height="80" rx="40" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="270" y="180" font-size="26" font-weight="600" text-anchor="middle">Step starts</text>

    <rect x="600" y="130" width="400" height="80" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="800" y="180" font-size="26" font-weight="600" text-anchor="middle">Budget check: tokens, time</text>

    <rect x="1120" y="130" width="400" height="80" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1320" y="180" font-size="26" font-weight="600" text-anchor="middle">TOKEN_LIMIT · TIME_LIMIT</text>

    <rect x="600" y="290" width="400" height="80" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="800" y="340" font-size="26" font-weight="600" text-anchor="middle">Model call, shrunk to fit</text>

    <rect x="1170" y="290" width="350" height="80" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="3"/>
    <text x="1345" y="340" font-size="26" font-weight="600" text-anchor="middle">MODEL_ERROR</text>

    <rect x="600" y="450" width="400" height="80" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="800" y="500" font-size="26" font-weight="600" text-anchor="middle">Stop reason?</text>

    <rect x="80" y="450" width="380" height="80" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="270" y="500" font-size="26" font-weight="600" text-anchor="middle">Run tools, append results</text>

    <rect x="80" y="660" width="380" height="80" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="270" y="710" font-size="26" font-weight="600" text-anchor="middle">STEP_LIMIT</text>

    <rect x="560" y="660" width="300" height="80" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="710" y="710" font-size="26" font-weight="600" text-anchor="middle">FINISHED</text>

    <rect x="890" y="660" width="300" height="80" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1040" y="694" font-size="26" font-weight="600" text-anchor="middle">TRUNCATED</text>
    <text x="1040" y="726" font-size="22" text-anchor="middle">or TOKEN_LIMIT</text>

    <rect x="1220" y="660" width="300" height="80" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="3"/>
    <text x="1370" y="710" font-size="26" font-weight="600" text-anchor="middle">UNEXPECTED_STOP</text>

    <!-- arrows -->
    <g stroke="#CBD5E1" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arrow)">
      <line x1="460" y1="170" x2="590" y2="170"/>
      <line x1="1000" y1="170" x2="1110" y2="170"/>
      <line x1="800" y1="210" x2="800" y2="280"/>
      <line x1="1000" y1="330" x2="1160" y2="330"/>
      <line x1="800" y1="370" x2="800" y2="440"/>
      <line x1="600" y1="490" x2="470" y2="490"/>
      <line x1="270" y1="450" x2="270" y2="220"/>
      <line x1="270" y1="530" x2="270" y2="650"/>
      <polyline points="800,530 800,590 710,590 710,650"/>
      <polyline points="800,590 1040,590 1040,650"/>
      <polyline points="1040,590 1370,590 1370,650"/>
    </g>

    <!-- edge labels -->
    <g font-size="22">
      <text x="1055" y="155" text-anchor="middle">limit hit</text>
      <text x="815" y="255">room left</text>
      <text x="1082" y="315" text-anchor="middle">ModelError</text>
      <text x="535" y="475" text-anchor="middle">tool_call</text>
      <text x="290" y="345">steps left</text>
      <text x="290" y="600">range used up</text>
      <text x="580" y="630">finished</text>
      <text x="910" y="630">truncated</text>
      <text x="1140" y="630">other, or no calls</text>
    </g>

    <text x="80" y="830" font-size="22">Only FINISHED is an answer. Every other cause tells you why the run stopped short.</text>
  </g>
</svg>
