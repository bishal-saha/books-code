<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-labelledby="t d">
  <title id="t">Agentic AI Foundations: From LLM Calls to Your First Agent. Agentic AI series, book 1, by Bishal Saha.</title>
  <desc id="d">Book cover. A navy background with a large circular loop of four steps (reason, act, observe, decide) around a central model node, with tool nodes attached to the act step.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#070E22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#14203F" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect width="1200" height="1800" fill="url(#grid)" opacity="0.6"/>

  <!-- Series label -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect x="100" y="120" width="300" height="56" rx="28" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="250" y="157" text-anchor="middle" font-size="26" font-weight="600" fill="#CBD5E1" letter-spacing="3">AGENTIC AI · 1</text>
  </g>

  <!-- Motif: the agent loop -->
  <g transform="translate(600 760)">
    <circle r="330" fill="none" stroke="#1E293B" stroke-width="40"/>
    <path d="M 0 -330 A 330 330 0 0 1 330 0" fill="none" stroke="#6366F1" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M 330 0 A 330 330 0 0 1 0 330" fill="none" stroke="#6366F1" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M 0 330 A 330 330 0 0 1 -330 0" fill="none" stroke="#6366F1" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M -330 0 A 330 330 0 0 1 0 -330" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrow)"/>

    <!-- central model -->
    <circle r="118" fill="#1E293B" stroke="#6366F1" stroke-width="4"/>
    <circle r="78" fill="none" stroke="#334155" stroke-width="2"/>
    <circle r="10" fill="#6366F1"/>

    <!-- steps -->
    <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="600" fill="#CBD5E1" text-anchor="middle">
      <rect x="-90" y="-362" width="180" height="64" rx="32" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
      <text y="-320">reason</text>
      <rect x="250" y="-32" width="160" height="64" rx="32" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
      <text x="330" y="10">act</text>
      <rect x="-100" y="298" width="200" height="64" rx="32" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
      <text y="340">observe</text>
      <rect x="-420" y="-32" width="180" height="64" rx="32" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
      <text x="-330" y="10">stop?</text>
    </g>

    <!-- tools attached to act -->
    <g stroke="#14B8A6" stroke-width="3" fill="none">
      <path d="M 410 0 L 470 -90"/>
      <path d="M 410 0 L 490 0"/>
      <path d="M 410 0 L 470 90"/>
    </g>
    <g fill="#0B1530" stroke="#14B8A6" stroke-width="3">
      <rect x="452" y="-128" width="56" height="56" rx="12"/>
      <rect x="490" y="-28" width="56" height="56" rx="12"/>
      <rect x="452" y="72" width="56" height="56" rx="12"/>
    </g>
  </g>

  <!-- Title block -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="100" y="1300" font-size="104" font-weight="700" fill="#F8FAFC">Agentic AI</text>
    <text x="100" y="1412" font-size="104" font-weight="700" fill="#F8FAFC">Foundations</text>
    <rect x="100" y="1452" width="120" height="8" rx="4" fill="#6366F1"/>
    <text x="100" y="1530" font-size="44" font-weight="400" fill="#CBD5E1">From LLM Calls to Your First Agent</text>
    <text x="100" y="1680" font-size="36" font-weight="600" fill="#94A3B8" letter-spacing="2">BISHAL SAHA</text>
    <text x="1100" y="1680" text-anchor="end" font-size="26" fill="#64748B">iambishal.com</text>
  </g>
</svg>
