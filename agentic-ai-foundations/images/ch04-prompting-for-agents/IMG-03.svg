<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">compare.py: two prompt versions on the same tickets</title>
  <desc id="d">The five ticket IDs in tickets.json, plus an optional local fixture, are fetched from the Kestrel mock API with their order, shipment and current policies; a ticket that returns 404 is marked skipped. Each ticket gets one user message that is sent once with prompt version 1 and once with version 2, twelve model calls for six tickets. A failed call becomes an error cell. The Markdown report has a summary table with word counts and flags, then every draft with its stop reason and tokens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="92" font-size="40" font-weight="600">Same inputs, two prompts, one report</text>

    <rect x="80" y="180" width="300" height="110" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="230" y="227" font-size="26" font-weight="600" text-anchor="middle">tickets.json</text>
    <text x="230" y="263" font-size="22" text-anchor="middle">5 seeded IDs</text>
    <rect x="80" y="330" width="300" height="110" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="230" y="377" font-size="26" font-weight="600" text-anchor="middle">--extra fixture</text>
    <text x="230" y="413" font-size="22" text-anchor="middle">local ticket file</text>

    <rect x="460" y="240" width="320" height="140" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="620" y="290" font-size="26" font-weight="600" text-anchor="middle">load_ticket()</text>
    <text x="620" y="327" font-size="22" text-anchor="middle">order, shipment,</text>
    <text x="620" y="357" font-size="22" text-anchor="middle">current policies</text>

    <rect x="460" y="520" width="320" height="90" rx="45" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <text x="620" y="575" font-size="24" text-anchor="middle">404: row skipped</text>

    <rect x="860" y="180" width="300" height="100" rx="50" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1010" y="240" font-size="26" font-weight="600" text-anchor="middle">prompt v1</text>
    <rect x="860" y="340" width="300" height="100" rx="50" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1010" y="400" font-size="26" font-weight="600" text-anchor="middle">prompt v2</text>
    <text x="1010" y="490" font-size="22" text-anchor="middle">same user message,</text>
    <text x="1010" y="522" font-size="22" text-anchor="middle">6 tickets × 2 = 12 calls</text>

    <rect x="860" y="600" width="300" height="90" rx="45" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <text x="1010" y="655" font-size="24" text-anchor="middle">ModelError: error cell</text>

    <rect x="1240" y="180" width="280" height="510" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="1265" y="230" font-size="26" font-weight="600">report.md</text>
    <text x="1265" y="280" font-size="22">summary table</text>
    <text x="1265" y="330" font-size="22">NEEDS INFO</text>
    <text x="1265" y="370" font-size="22">OVER 150 WORDS</text>
    <text x="1265" y="410" font-size="22">COPIED EXAMPLE</text>
    <text x="1265" y="450" font-size="22">TRUNCATED</text>
    <text x="1265" y="510" font-size="22">every draft with</text>
    <text x="1265" y="545" font-size="22">stop reason and</text>
    <text x="1265" y="580" font-size="22">tokens in/out</text>

    <g stroke="#CBD5E1" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M380 235 H420 V290 H450"/>
      <path d="M380 385 H420 V330 H450"/>
      <path d="M620 380 V510"/>
      <path d="M780 290 H820 V230 H850"/>
      <path d="M780 330 H820 V390 H850"/>
      <path d="M1160 230 H1230"/>
      <path d="M1160 390 H1230"/>
      <path d="M1160 645 H1230"/>
      <path d="M780 565 H1200 V600 H1230"/>
    </g>
    <text x="80" y="790" font-size="22">No loop and no retries of its own: the worst case is 12 × (1 + the SDK's max_retries) HTTP requests.</text>
  </g>
</svg>
