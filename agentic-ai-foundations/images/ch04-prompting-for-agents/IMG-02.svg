<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">How prompt_builder.py builds one request</title>
  <desc id="d">A versioned prompt file is loaded and its header checked, and its body becomes the system prompt. The ticket, order, shipment and policies come from the Kestrel mock API, every value is escaped so less-than and greater-than signs become entities, and render_ticket wraps them in tags in a fixed order, writing none for missing records. draft_reply sends both through ModelClient: the Anthropic adapter in real runs, the fake model in tests. The result is a Draft that records the prompt version, stop reason and token counts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="92" font-size="40" font-weight="600">From prompt file and ticket to one request</text>

    <!-- Top row: prompt file -->
    <rect x="80" y="160" width="380" height="110" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="270" y="207" font-size="26" font-weight="600" text-anchor="middle">support_reply_v2.md</text>
    <text x="270" y="243" font-size="22" text-anchor="middle">header + body</text>
    <rect x="560" y="160" width="380" height="110" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="750" y="207" font-size="26" font-weight="600" text-anchor="middle">load_prompt()</text>
    <text x="750" y="243" font-size="22" text-anchor="middle">checks the version</text>

    <!-- Bottom row: ticket path -->
    <path d="M80 420 a190 24 0 0 0 380 0 v110 a190 24 0 0 1 -380 0 z" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <ellipse cx="270" cy="420" rx="190" ry="24" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="270" y="490" font-size="26" font-weight="600" text-anchor="middle">Kestrel mock API</text>
    <text x="270" y="526" font-size="22" text-anchor="middle">ticket, order, shipment, policies</text>
    <rect x="560" y="420" width="380" height="130" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="750" y="465" font-size="26" font-weight="600" text-anchor="middle">_esc() every value</text>
    <text x="750" y="510" font-size="24" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" xml:space="preserve">&lt;  becomes  &amp;lt;    &gt;  becomes  &amp;gt;</text>
    <rect x="560" y="610" width="380" height="130" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="750" y="655" font-size="26" font-weight="600" text-anchor="middle">render_ticket()</text>
    <text x="750" y="693" font-size="22" text-anchor="middle">fixed tag order, "none" if missing</text>

    <!-- draft_reply -->
    <rect x="1040" y="380" width="200" height="110" rx="55" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="1140" y="445" font-size="26" font-weight="600" text-anchor="middle">draft_reply</text>

    <!-- clients -->
    <rect x="1310" y="200" width="230" height="100" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="1425" y="243" font-size="24" font-weight="600" text-anchor="middle">Anthropic</text>
    <text x="1425" y="277" font-size="22" text-anchor="middle">adapter (runs)</text>
    <rect x="1310" y="330" width="230" height="100" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="1425" y="373" font-size="24" font-weight="600" text-anchor="middle">Fake model</text>
    <text x="1425" y="407" font-size="22" text-anchor="middle">(tests, no key)</text>
    <rect x="1310" y="560" width="230" height="170" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="1335" y="605" font-size="26" font-weight="600">Draft</text>
    <text x="1335" y="645" font-size="22">prompt version</text>
    <text x="1335" y="680" font-size="22">stop reason</text>
    <text x="1335" y="715" font-size="22">tokens in/out</text>

    <g stroke="#CBD5E1" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M460 215 H550"/>
      <path d="M940 215 H990 V410 H1030"/>
      <path d="M460 475 H550"/>
      <path d="M750 550 V600"/>
      <path d="M940 675 H990 V460 H1030"/>
      <path d="M1240 420 H1270 V250 H1300"/>
      <path d="M1240 440 H1270 V380 H1300"/>
      <path d="M1240 460 H1270 V645 H1300"/>
    </g>
    <text x="960" y="190" font-size="22">system</text>
    <text x="1005" y="600" font-size="22">user</text>
    <text x="1005" y="630" font-size="22">message</text>
    <text x="80" y="820" font-size="22">A customer who types &lt;/ticket&gt; produces &amp;lt;/ticket&amp;gt;, which cannot close the tag.</text>
  </g>
</svg>
