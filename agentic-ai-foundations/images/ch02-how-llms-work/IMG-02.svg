<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">One early sampled token sends two runs down different paths</title>
  <desc id="d">The same prompt with the same settings reaches a sampling step. In run 1 the sampler picks the token "within", in run 2 it picks "up to". Every later pick follows from that choice, so the two runs end with differently worded answers. Code then checks that both answers state the same fact, 30 days.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#0B1530"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" fill="#CBD5E1">
    <text x="80" y="96" font-size="40" font-weight="600">Same request, two runs, two wordings</text>

    <!-- prompt -->
    <rect x="80" y="370" width="270" height="140" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="215" y="428" font-size="27" font-weight="600" text-anchor="middle">Same prompt,</text>
    <text x="215" y="466" font-size="27" font-weight="600" text-anchor="middle">same settings</text>

    <!-- sample -->
    <path d="M520 360 L610 440 L520 520 L430 440 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <text x="520" y="432" font-size="22" font-weight="600" text-anchor="middle">Sample</text>
    <text x="520" y="460" font-size="22" font-weight="600" text-anchor="middle">a token</text>
    <line x1="350" y1="440" x2="424" y2="440" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- run 1 -->
    <path d="M560 400 L640 250 L700 250" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="560" y="300" font-size="22">run 1</text>
    <rect x="706" y="200" width="200" height="100" rx="50" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="806" y="260" font-size="28" font-weight="600" text-anchor="middle">"within"</text>
    <line x1="906" y1="250" x2="984" y2="250" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="990" y="190" width="520" height="120" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="1250" y="240" font-size="24" text-anchor="middle">"...return an unused item within</text>
    <text x="1250" y="276" font-size="24" text-anchor="middle">30 days of delivery."</text>

    <!-- run 2 -->
    <path d="M560 480 L640 630 L700 630" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="560" y="600" font-size="22">run 2</text>
    <rect x="706" y="580" width="200" height="100" rx="50" fill="#1E293B" stroke="#6366F1" stroke-width="3"/>
    <text x="806" y="640" font-size="28" font-weight="600" text-anchor="middle">"up to"</text>
    <line x1="906" y1="630" x2="984" y2="630" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="990" y="570" width="520" height="120" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="1250" y="620" font-size="24" text-anchor="middle">"...has up to 30 days from</text>
    <text x="1250" y="656" font-size="24" text-anchor="middle">delivery to return it."</text>

    <!-- check -->
    <rect x="1090" y="380" width="320" height="120" rx="14" fill="#1E293B" stroke="#14B8A6" stroke-width="3"/>
    <text x="1250" y="430" font-size="26" font-weight="600" text-anchor="middle">Code checks</text>
    <text x="1250" y="468" font-size="22" text-anchor="middle">both state 30 days?</text>
    <line x1="1250" y1="310" x2="1250" y2="374" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1250" y1="570" x2="1250" y2="506" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="80" y="800" font-size="22">Every later pick builds on the early one, so wording and length drift apart.</text>
    <text x="80" y="836" font-size="22">Different wording is expected; a different fact is a defect.</text>
  </g>
</svg>
